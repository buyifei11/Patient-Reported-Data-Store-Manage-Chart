<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">From patient words to reviewable trends</title>
<desc id="desc">Track B pipeline: reviewed synthetic text, LLM claim extraction, Python validation, SQLite storage, correction-aware rules and SQL, and dashboard. Reference answers feed a separate evaluation branch. Live demonstration replays saved model candidates without new API calls.</desc>
<defs>
 <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#547371"/></marker>
 <marker id="purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#8063ac"/></marker>
</defs>
<rect width="1920" height="1080" fill="#f5f7f4"/>
<rect width="1920" height="12" fill="#147b73"/>
<g font-family="Arial, Helvetica, sans-serif">

<text x="70" y="65" font-size="18" fill="#147b73" font-weight="700">TRACK B  /  PATIENT-REPORTED DATA</text>
<text x="70" y="128" font-size="52" fill="#173e3b" font-weight="700">From patient words to reviewable trends</text>
<text x="70" y="166" font-size="23" fill="#5f7371" font-weight="400">71 synthetic reports  •  3 patients  •  4 weeks  •  all symptom reports pass through text extraction</text>
<rect x="70" y="205" width="570" height="112" rx="18" fill="#eaf3ee" stroke="#d3e3da" stroke-width="2"/>
<text x="94" y="234" font-size="16" fill="#147b73" font-weight="700">DATA PREPARATION</text>
<text x="94" y="267" font-size="23" fill="#243e3d" font-weight="400">Facts → generated text → source review</text>
<text x="94" y="297" font-size="20" fill="#5f7371" font-weight="400">Original texts retained; form facts verbalized.</text>
<rect x="674" y="205" width="1174" height="112" rx="18" fill="#eef1f6" stroke="#d9dfe8" stroke-width="2"/>
<text x="698" y="234" font-size="16" fill="#536584" font-weight="700">STRUCTURED CONTEXT  /  USED BY CODE</text>
<text x="698" y="267" font-size="23" fill="#243e3d" font-weight="400">Patient ID, submission time, timezone, correction links, medication changes</text>
<text x="698" y="297" font-size="20" fill="#5f7371" font-weight="400">The extraction model receives report text plus instructions and schema; no reference answers.</text>
<path d="M 204 317 L 204 375" fill="none" stroke="#547371" stroke-width="3"  marker-end="url(#arrow)"/>
<path d="M 808 317 L 808 375" fill="none" stroke="#547371" stroke-width="3"  marker-end="url(#arrow)"/>
<path d="M 1412 317 L 1412 375" fill="none" stroke="#547371" stroke-width="3"  marker-end="url(#arrow)"/>
<rect x="70" y="380" width="268" height="244" rx="18" fill="#ffffff" stroke="#d5dfd9" stroke-width="2"/>
<circle cx="106" cy="416" r="19" fill="#e6f1ed"/>
<text x="95" y="422" font-size="16" fill="#147b73" font-weight="700">01</text>
<text x="94" y="465" font-size="25" fill="#173e3b" font-weight="700">Source reports</text>
<text x="94" y="502" font-size="20" fill="#526c69" font-weight="400">English free text</text>
<text x="94" y="531" font-size="20" fill="#526c69" font-weight="400">71 source records</text>
<text x="94" y="560" font-size="20" fill="#526c69" font-weight="400">3 patients / 4 weeks</text>
<text x="94" y="600" font-size="13" fill="#147b73" font-weight="700">SOURCE</text>
<path d="M 340 484 L 368 484" fill="none" stroke="#547371" stroke-width="3"  marker-end="url(#arrow)"/>
<rect x="372" y="380" width="268" height="244" rx="18" fill="#ffffff" stroke="#d5dfd9" stroke-width="2"/>
<circle cx="408" cy="416" r="19" fill="#e6f1ed"/>
<text x="397" y="422" font-size="16" fill="#147b73" font-weight="700">02</text>
<text x="396" y="465" font-size="25" fill="#173e3b" font-weight="700">LLM extraction</text>
<text x="396" y="502" font-size="20" fill="#526c69" font-weight="400">Symptom claims</text>
<text x="396" y="531" font-size="20" fill="#526c69" font-weight="400">Counts, ratings, timing</text>
<text x="396" y="560" font-size="20" fill="#526c69" font-weight="400">Exact source quotes</text>
<text x="396" y="600" font-size="13" fill="#147b73" font-weight="700">GPT-5.4 MINI</text>
<path d="M 642 484 L 670 484" fill="none" stroke="#547371" stroke-width="3"  marker-end="url(#arrow)"/>
<rect x="674" y="380" width="268" height="244" rx="18" fill="#ffffff" stroke="#d5dfd9" stroke-width="2"/>
<circle cx="710" cy="416" r="19" fill="#e6f1ed"/>
<text x="699" y="422" font-size="16" fill="#147b73" font-weight="700">03</text>
<text x="698" y="465" font-size="25" fill="#173e3b" font-weight="700">Python checks</text>
<text x="698" y="502" font-size="20" fill="#526c69" font-weight="400">Schema + evidence</text>
<text x="698" y="531" font-size="20" fill="#526c69" font-weight="400">Dates + score context</text>
<text x="698" y="560" font-size="20" fill="#526c69" font-weight="400">Unknowns + conflicts</text>
<text x="698" y="600" font-size="13" fill="#147b73" font-weight="700">DETERMINISTIC</text>
<path d="M 944 484 L 972 484" fill="none" stroke="#547371" stroke-width="3"  marker-end="url(#arrow)"/>
<rect x="976" y="380" width="268" height="244" rx="18" fill="#ffffff" stroke="#d5dfd9" stroke-width="2"/>
<circle cx="1012" cy="416" r="19" fill="#e6f1ed"/>
<text x="1001" y="422" font-size="16" fill="#147b73" font-weight="700">04</text>
<text x="1000" y="465" font-size="25" fill="#173e3b" font-weight="700">SQLite store</text>
<text x="1000" y="502" font-size="20" fill="#526c69" font-weight="400">Source + model output</text>
<text x="1000" y="531" font-size="20" fill="#526c69" font-weight="400">Evidence + run history</text>
<text x="1000" y="560" font-size="20" fill="#526c69" font-weight="400">All versions retained</text>
<text x="1000" y="600" font-size="13" fill="#147b73" font-weight="700">TRACEABLE</text>
<path d="M 1246 484 L 1274 484" fill="none" stroke="#547371" stroke-width="3"  marker-end="url(#arrow)"/>
<rect x="1278" y="380" width="268" height="244" rx="18" fill="#ffffff" stroke="#d5dfd9" stroke-width="2"/>
<circle cx="1314" cy="416" r="19" fill="#e6f1ed"/>
<text x="1303" y="422" font-size="16" fill="#147b73" font-weight="700">05</text>
<text x="1302" y="465" font-size="25" fill="#173e3b" font-weight="700">Rules + SQL</text>
<text x="1302" y="502" font-size="20" fill="#526c69" font-weight="400">Apply corrections</text>
<text x="1302" y="531" font-size="20" fill="#526c69" font-weight="400">Daily / weekly counts</text>
<text x="1302" y="560" font-size="20" fill="#526c69" font-weight="400">Medication-change timing</text>
<text x="1302" y="600" font-size="13" fill="#147b73" font-weight="700">NO DOUBLE COUNTING</text>
<path d="M 1548 484 L 1576 484" fill="none" stroke="#547371" stroke-width="3"  marker-end="url(#arrow)"/>
<rect x="1580" y="380" width="268" height="244" rx="18" fill="#ffffff" stroke="#d5dfd9" stroke-width="2"/>
<circle cx="1616" cy="416" r="19" fill="#e6f1ed"/>
<text x="1605" y="422" font-size="16" fill="#147b73" font-weight="700">06</text>
<text x="1604" y="465" font-size="25" fill="#173e3b" font-weight="700">Dashboard</text>
<text x="1604" y="502" font-size="20" fill="#526c69" font-weight="400">Trends + coverage</text>
<text x="1604" y="531" font-size="20" fill="#526c69" font-weight="400">Review + source details</text>
<text x="1604" y="560" font-size="20" fill="#526c69" font-weight="400">Gaps stay visible</text>
<text x="1604" y="600" font-size="13" fill="#147b73" font-weight="700">PROVIDER VIEW</text>
<path d="M 506 624 L 506 677 L 640 677 L 640 729" fill="none" stroke="#8063ac" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#purple)"/>
<path d="M 808 624 L 808 677 L 660 677" fill="none" stroke="#8063ac" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#purple)"/>
<text x="74" y="692" font-size="17" fill="#5f7371" font-weight="700">ACTUAL MODEL OUTPUTS ARE PRESERVED</text>
<rect x="70" y="735" width="1174" height="207" rx="18" fill="#f2edf8" stroke="#b9a6ce" stroke-width="2" stroke-dasharray="8 6"/>
<text x="98" y="771" font-size="17" fill="#745299" font-weight="700">EVALUATION ONLY</text>
<text x="98" y="813" font-size="27" fill="#48345e" font-weight="700">Reviewed reference answers + actual candidates / observations</text>
<text x="98" y="852" font-size="23" fill="#665676" font-weight="400">Compare semantic fields, record structure, evidence, and failures.</text>
<text x="98" y="891" font-size="21" fill="#665676" font-weight="400">Development cases → frozen new-case validation → known longitudinal integration</text>
<text x="98" y="922" font-size="19" fill="#745299" font-weight="700">Reference answers never populate the database or dashboard.</text>
<rect x="1278" y="735" width="570" height="207" rx="18" fill="#e8f2ef" stroke="#bcd7cf" stroke-width="2"/>
<text x="1306" y="771" font-size="17" fill="#147b73" font-weight="700">LIVE DEMO  /  OFFLINE REPLAY</text>
<text x="1306" y="813" font-size="26" fill="#173e3b" font-weight="700">Saved candidates → Python</text>
<text x="1306" y="850" font-size="26" fill="#173e3b" font-weight="700">→ SQLite → SQL → charts</text>
<text x="1306" y="890" font-size="22" fill="#526c69" font-weight="400">Real saved LLM output; no new API calls.</text>
<text x="1306" y="922" font-size="19" fill="#526c69" font-weight="400">Fresh extraction is a separate optional step.</text>
<path d="M70 985 H1848" stroke="#d5dfd9" stroke-width="2"/>
<text x="70" y="1023" font-size="24" fill="#173e3b" font-weight="700">AI extracts claims. Code checks, preserves, and aggregates them.</text>
<text x="70" y="1053" font-size="19" fill="#5f7371" font-weight="400">Prompt engineering + deterministic rules; no model fine-tuning. Medication timing does not establish causation.</text>
</g></svg>
